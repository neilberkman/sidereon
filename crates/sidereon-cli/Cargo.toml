[package]
name = "sidereon-cli"
version = "0.6.0"
edition = "2021"
publish = false

[[bin]]
name = "sidereon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
tokio = { version = "1", features = ["rt", "io-std", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sidereon = { path = "../sidereon", version = "0.30.0" }
sidereon-core = { path = "../sidereon-core", version = "0.30.0" }

[dev-dependencies]
portable-pty = "0.9.0"
vt100 = "0.16.2"
