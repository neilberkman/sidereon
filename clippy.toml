    { path = "f32::sin", reason = "portable numerics require libm delegates" },
    { path = "f32::cos", reason = "portable numerics require libm delegates" },
    { path = "f32::tan", reason = "portable numerics require libm delegates" },
    { path = "f32::asin", reason = "portable numerics require libm delegates" },
