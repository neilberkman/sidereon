    { path = "f32::exp", reason = "portable numerics require libm delegates" },
    { path = "f32::exp2", reason = "portable numerics require libm delegates" },
    { path = "f32::exp_m1", reason = "portable numerics require libm delegates" },
    { path = "f32::ln", reason = "portable numerics require libm delegates" },
