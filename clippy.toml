# `f64::powi` is intentionally omitted: the compiler lowers it to repeated
# squaring. `crates/sidereon-core/tests/powi_portability.rs` checks all literal
# exponents found in production and the runtime exponent interval over 10,000
# random bases, including the signed and non-power-of-two cases.
