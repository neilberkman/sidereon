name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A workflow file can be valid YAML and still be a broken workflow - a
  # branch filter on workflow_call parses fine and then fails the run in 0s
  # with no useful message. Lint the workflows themselves.
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@3a24062651993d40fed1019b58ac6fbdfbf276cc # v2.0.1
        with:
          flags: "-shellcheck= -pyflakes="

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  geoid-proj-x86_64:
    name: PROJ geoid arithmetic (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Require x86_64 runner
        run: test "$(uname -m)" = x86_64
      - name: Verify fused and separately rounded PROJ arithmetic
        run: cargo test -p sidereon-core geoid::tests::proj_
