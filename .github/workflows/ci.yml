name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Callable so the release workflow gates on this exact bar rather than a
  # weaker copy of it. Two lists drift, and the weaker one ends up guarding
  # the irreversible action.
  workflow_call:

jobs:
  # A workflow file can be valid YAML and still be a broken workflow - a
  # branch filter on workflow_call parses fine and then fails the run in 0s
  # with no useful message. Lint the workflows themselves.
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pinned upstream binary, not a wrapper action: a wrapper resolves
      # its own Node dependencies out of this repository's root node_modules
      # and dies before it lints anything. Running the same binary the same way
      # locally and in CI is the point.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -shellcheck= -pyflakes=

  # Lint and tests are separate jobs so clippy overlaps the test shards
  # instead of serializing ahead of them. Both share one cache key with each
  # other and with the release gate: rust-cache keys on the workflow name by
  # default, so the tag-triggered release workflow_call previously recompiled
  # cold even though push CI had just built the identical commit.
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-macos
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Doctests do not run under nextest; they live here where the workspace
      # is already compiled for clippy.
      - name: Doctests
        run: cargo test --workspace --doc

  test:
    name: test (${{ matrix.os == 'macos-latest' && 'arm64' || 'x86_64' }} shard ${{ matrix.shard }}/3)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The frozen-bit fixtures are architecture-sensitive: transcendental
        # results can differ in the last bits between arm64 and x86_64. Running
        # the suite on both is what proves the portable-math kernels actually
        # deliver cross-architecture determinism rather than only matching the
        # architecture the fixtures were captured on.
        os: [macos-latest, ubuntu-latest]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
      - uses: taiki-e/install-action@nextest
      - name: Confirm runner architecture
        shell: bash
        run: |
          got=$(uname -m)
          want='${{ matrix.os == 'macos-latest' && 'arm64' || 'x86_64' }}'
          test "$got" = "$want" || { echo "expected $want runner, got $got" >&2; exit 1; }
      - name: Test
        run: cargo nextest run --no-fail-fast --workspace --partition count:${{ matrix.shard }}/3

  geoid-proj-x86_64:
    name: PROJ geoid arithmetic (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Require x86_64 runner
        run: test "$(uname -m)" = x86_64
      - name: Verify fused and separately rounded PROJ arithmetic
        run: cargo test -p sidereon-core geoid::tests::proj_

  hotpath-perf:
    name: hotpath performance (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
      - name: Require x86_64 runner
        run: test "$(uname -m)" = x86_64
      - name: Run merge-base hotpath benchmark
        shell: bash
        run: |
          set -euo pipefail
          base_commit="$(git merge-base HEAD origin/main)"
          base_worktree="$(mktemp -d "$RUNNER_TEMP/sidereon-base.XXXXXX")"
          base_target="$RUNNER_TEMP/sidereon-base-target"
          base_criterion="$RUNNER_TEMP/sidereon-base-criterion"
          artifact_dir="$RUNNER_TEMP/hotpath-criterion/base"
          git worktree add --detach "$base_worktree" "$base_commit"
          trap 'git worktree remove --force "$base_worktree"' EXIT
          # The merge base predates the expanded benchmark. Use the branch's
          # harness for both trees so every application and linear-algebra case
          # has the same inputs and benchmark code.
          cp crates/sidereon-core/benches/hotpath.rs \
            "$base_worktree/crates/sidereon-core/benches/hotpath.rs"
          cd "$base_worktree"
          CRITERION_HOME="$base_criterion" cargo bench \
            --manifest-path "$base_worktree/Cargo.toml" \
            --target-dir "$base_target" \
            -p sidereon-core --bench hotpath -- \
            --noplot --sample-size 10 --measurement-time 1
          mkdir -p "$artifact_dir"
          cp -R "$base_criterion/." "$artifact_dir/"
      - name: Run branch hotpath benchmark
        shell: bash
        run: |
          set -euo pipefail
          branch_target="$RUNNER_TEMP/sidereon-branch-target"
          branch_criterion="$RUNNER_TEMP/sidereon-branch-criterion"
          CRITERION_HOME="$branch_criterion" cargo bench \
            --target-dir "$branch_target" \
            -p sidereon-core --bench hotpath -- \
            --noplot --sample-size 10 --measurement-time 1
          mkdir -p "$RUNNER_TEMP/hotpath-criterion/branch"
          cp -R "$branch_criterion/." \
            "$RUNNER_TEMP/hotpath-criterion/branch/"
      - name: Compare merge base and branch
        run: |
          python3 crates/sidereon-core/benches/check_hotpath.py \
            "$RUNNER_TEMP/hotpath-criterion/base" \
            "$RUNNER_TEMP/hotpath-criterion/branch"
      - name: Upload Criterion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotpath-criterion
          path: ${{ runner.temp }}/hotpath-criterion
          if-no-files-found: warn
