name: Published SP3 accuracy 3.0.6 audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/sp3-accuracy-published-306
    paths:
      - .github/workflows/sp3-accuracy-published-306.yml
      - rust-repro/**

permissions:
  contents: read

jobs:
  published-306:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Verify crates.io source and exact versions
        run: |
          cargo metadata --format-version 1 --manifest-path rust-repro/Cargo.toml > /tmp/sp3-306-metadata.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/sp3-306-metadata.json'))
          for name in ('sidereon', 'sidereon-core'):
              packages = [p for p in data['packages'] if p['name'] == name]
              assert len(packages) == 1, (name, packages)
              package = packages[0]
              assert package['version'] == '3.0.6', package
              assert package['source'] == 'registry+https://github.com/rust-lang/crates.io-index', package
              print(name, package['version'], package['source'])
          PY
      - name: Test published Rust and facade crates
        run: cargo test --locked --manifest-path rust-repro/Cargo.toml
